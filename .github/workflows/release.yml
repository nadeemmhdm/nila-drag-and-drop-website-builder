name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release source
        run: npm run verify

      - name: Package editor build
        run: |
          cd dist
          zip -qr ../nila-editor-dist.zip .

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating build asset."
            gh release upload "${GITHUB_REF_NAME}" \
              nila-editor-dist.zip#Nila-editor-production-build.zip \
              --clobber
          else
            args=(--verify-tag --generate-notes --title "Nila ${GITHUB_REF_NAME}")
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" \
              nila-editor-dist.zip#Nila-editor-production-build.zip \
              "${args[@]}"
          fi
