name: Materialize Nila source

on:
  push:
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack source
        shell: bash
        run: |
          set -euo pipefail
          cat .nila-bootstrap/part* | base64 -d > /tmp/nila-source.tar.xz
          echo "864cb137d49647c86a8ad7d8e124cfa654c114649aa6f7c077117045877224f6  /tmp/nila-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/nila-source.tar.xz
          rm -rf .nila-bootstrap .github/workflows/materialize.yml .gitkeep

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: build Nila drag-and-drop website builder"
          git push origin HEAD:main

# Trigger after workflow exists on the default branch.
