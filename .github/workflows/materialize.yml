name: Materialize Phase 1 foundation

on:
  push:
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize Phase 1 source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .phase1.b64 > /tmp/nila-phase1.tar.xz
          echo "d1f3346d0f72f3056d8b1369d92bd57b314d1f6f069870311bb5a770d34d3df9  /tmp/nila-phase1.tar.xz" | sha256sum -c -
          rm -rf .nila-bootstrap .gitkeep
          tar --exclude='./.github/workflows/ci.yml' -xJf /tmp/nila-phase1.tar.xz
          rm -f .phase1.b64

      - name: Commit Phase 1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete phase 1 foundation source"
          git push origin HEAD:main
