name: Bug report
description: Report a reproducible Nila problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nila version or commit
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
